# First `docker compose up -d`: perkeepd bootstraps itself (SQLite + a fresh GPG identity),
# with default "localhost" auth and no postgres -- there's no safe way to pre-seed that from
# outside the perkeepd process (see docker/entrypoint.py). Set PERKEEP_WEB_USER/PASSWORD and
# PERKEEP_INDEX_BACKEND=postgres in .env (copy .env.example), then run
# `docker compose up -d` again (or `restart perkeep`) -- the entrypoint patches
# server-config.json and, if the backend just changed, runs the one-time
# -reindex -recovery=2 pass before the server starts serving.
services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PERKEEP_PG_USER:-perkeep}
      POSTGRES_PASSWORD: ${PERKEEP_PG_PASSWORD:?set PERKEEP_PG_PASSWORD in .env}
      # Deliberately NOT the same as POSTGRES_USER -- Perkeep's postgres bootstrap used to
      # require a database literally named after the connecting role to already exist
      # (libpq defaults an unspecified dbname to the role's username); this stack is the
      # regression test for the fix (connect to Postgres's own "postgres" maintenance
      # database instead), so it deliberately does NOT recreate that coincidence.
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERKEEP_PG_USER:-perkeep}"]
      interval: 5s
      retries: 10

  perkeep:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # Verified live: without this, a hard kill mid-startup (e.g. OOM, a host reboot) leaves
    # the container in Exited state with no further action -- the entrypoint's own retry
    # logic (safe to re-run the recovery pass, see docker/entrypoint.py) only ever gets a
    # chance to run if something actually restarts the container.
    restart: unless-stopped
    environment:
      PERKEEP_INDEX_BACKEND: ${PERKEEP_INDEX_BACKEND:-sqlite}
      PERKEEP_PG_HOST: postgres
      PERKEEP_PG_USER: ${PERKEEP_PG_USER:-perkeep}
      PERKEEP_PG_PASSWORD: ${PERKEEP_PG_PASSWORD:?set PERKEEP_PG_PASSWORD in .env}
      PERKEEP_WEB_USER: ${PERKEEP_WEB_USER:-}
      PERKEEP_WEB_PASSWORD: ${PERKEEP_WEB_PASSWORD:-}
      PERKEEP_AUTH_MODE: ${PERKEEP_AUTH_MODE:-userpass}
      PERKEEP_BASE_URL: ${PERKEEP_BASE_URL:-}
    volumes:
      - perkeep-config:/home/keepy/.config/perkeep
      - perkeep-var:/home/keepy/var/perkeep
    ports:
      - "3179:3179"

volumes:
  pgdata:
  perkeep-config:
  perkeep-var:
